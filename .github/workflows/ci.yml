name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck if missing
        run: |
          if ! command -v shellcheck >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else sudo apt-get update && sudo apt-get install -y shellcheck; fi
          fi

      - name: Shellcheck hook scripts
        run: shellcheck plugins/codex-review/hooks/scripts/*.sh

      - name: Run hook tests
        run: npx --yes bats tests

      - name: Validate plugin and marketplace manifests
        if: runner.os == 'Linux'
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate plugins/codex-review
          npx --yes @anthropic-ai/claude-code plugin validate .
